<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengaturan & Database ERD - POS SEKOLAH</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-layout">
    <!-- 1. SIDEBAR KIRI -->
    <aside class="app-sidebar" id="appSidebar"></aside>

    <!-- 2. MAIN WRAPPER -->
    <div class="app-main-wrapper">
      <!-- TOPBAR HEADER -->
      <header class="app-topbar" id="appTopbar"></header>

      <!-- KONTEN PENGATURAN & DATABASE -->
      <main class="app-main-content">
        <div class="page-header-row">
          <div>
            <h1 class="page-header-title">Pengaturan Sistem & Database ERD</h1>
            <p class="page-header-sub">Kelola konfigurasi multi-tenant, tabel database relasional, dan reset data awal</p>
          </div>
          <button class="btn-primary-teal" style="background: #dc2626;" onclick="resetDatabaseToDefault()">
            <i data-lucide="refresh-cw"></i>
            <span>Reset Database ke Default</span>
          </button>
        </div>

        <!-- ERD Tabs -->
        <div class="erd-tabs-row" id="erdTableTabs" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;">
          <button class="erd-tab-pill active" onclick="showErdTable('tb_sekolah')">tb_sekolah</button>
          <button class="erd-tab-pill" onclick="showErdTable('roles')">roles</button>
          <button class="erd-tab-pill" onclick="showErdTable('tb_user')">tb_user</button>
          <button class="erd-tab-pill" onclick="showErdTable('tb_barang')">tb_barang</button>
          <button class="erd-tab-pill" onclick="showErdTable('tb_kategori')">tb_kategori</button>
          <button class="erd-tab-pill" onclick="showErdTable('tb_kelompok_kategori')">tb_kelompok_kategori</button>
          <button class="erd-tab-pill" onclick="showErdTable('tb_supplier')">tb_supplier</button>
          <button class="erd-tab-pill" onclick="showErdTable('tb_pelanggan')">tb_pelanggan</button>
          <button class="erd-tab-pill" onclick="showErdTable('tb_pembelian')">tb_pembelian</button>
          <button class="erd-tab-pill" onclick="showErdTable('tb_penjualan')">tb_penjualan</button>
        </div>

        <div class="teal-table-card">
          <div class="erd-viewer-header" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--teal-100);">
            <div>
              <strong id="activeTableName" style="font-size: 1.1rem; color: var(--text-natural-dark);">tb_sekolah</strong>
              <span class="erd-count-badge" id="activeTableCount">3 Data Record</span>
            </div>
            <button class="btn-sm-action" onclick="exportCurrentTableJSON()">
              <i data-lucide="file-json"></i>
              <span>Export JSON</span>
            </button>
          </div>

          <div class="table-responsive">
            <table class="teal-table">
              <thead id="erdThead"></thead>
              <tbody id="erdTbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="shared.js"></script>
  <script>
    let activeTable = 'tb_sekolah';

    window.addEventListener('DOMContentLoaded', () => {
      initSharedLayout('pengaturan');
      showErdTable('tb_sekolah');
    });

    function showErdTable(tableName) {
      activeTable = tableName;
      document.querySelectorAll('.erd-tab-pill').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.trim() === tableName);
      });

      const data = db[tableName] || [];
      document.getElementById('activeTableName').textContent = tableName;
      document.getElementById('activeTableCount').textContent = `${data.length} Data Record`;

      const thead = document.getElementById('erdThead');
      const tbody = document.getElementById('erdTbody');

      if (data.length === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = `<tr><td style="text-align:center; padding: 24px; color:#94a3b8;">Tabel kosong.</td></tr>`;
        return;
      }

      const keys = Object.keys(data[0]);
      thead.innerHTML = `<tr>${keys.map(k => `<th>${k}</th>`).join('')}</tr>`;

      tbody.innerHTML = data.map(row => `
        <tr>
          ${keys.map(k => {
            let val = row[k];
            if (typeof val === 'string' && val.startsWith('data:image')) {
              return `<td>
                <div class="table-img-wrap" onclick="openImagePreview('${val}', '${row.nama || 'Foto Barang'}', ${row.harga_jual || 0})" title="Klik untuk memperbesar gambar">
                  <img src="${val}" class="table-img-thumb" style="width:36px;height:36px;" alt="Foto">
                  <span class="zoom-badge"><i data-lucide="zoom-in" style="width:8px;height:8px;"></i></span>
                </div>
              </td>`;
            }
            return `<td>${val !== undefined && val !== null ? val : '-'}</td>`;
          }).join('')}
        </tr>
      `).join('');

      if (window.lucide) lucide.createIcons();
    }

    function exportCurrentTableJSON() {
      const data = db[activeTable] || [];
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${activeTable}_export.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`Export ${activeTable} JSON berhasil!`, 'success');
    }
  </script>
</body>
</html>
